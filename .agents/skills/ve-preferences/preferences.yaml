# Preferencias de arpagon para visual-explainer
# El agente lee este archivo y aplica cada preferencia sobre SKILL.md
# después de sincronizar con upstream. Son intenciones, no parches exactos.

# ─── Entorno ────────────────────────────────────────────────────────────
# Estas variables deben existir para que el sharing via Cloudflare R2 funcione.
# Están en ~/.bashrc, NO en este archivo.
# VE_R2_ACCOUNT_ID, VE_R2_BUCKET, VE_R2_PUBLIC_URL, CLOUDFLARE_API_TOKEN

preferences:
  - name: opt-in-only
    intent: >
      Quitar TODO comportamiento proactivo/automático del skill.
      El skill solo debe activarse cuando el usuario pida explícitamente
      un diagrama visual, página HTML o explicación visual.
      Quitar o reescribir cualquier texto que diga "always", "never fall back",
      "proactively", "don't wait for the user to ask", "visual is always default"
      o directivas agresivas similares.
      Las tablas, ensayos y otro contenido NO deben convertirse en HTML automáticamente.
      El usuario decide cuándo usar este skill.
      Desde v0.14: el `description` del frontmatter debe decir "Use only when the
      user explicitly asks"; la regla "A terminal table of 4+ rows ... becomes a page"
      se reemplaza por una regla opt-in; y en extension.ts se quita el
      promptGuideline "offer a visual explanation" (nunca ofrecer por iniciativa propia).
      Las animaciones dentro de una página ya pedida (steppers, replays) sí se permiten.

  - name: agent-browser
    intent: >
      Reemplazar todas las referencias a surf-cli (herramienta de generación
      de imágenes con IA de Gemini) por agent-browser (herramienta de screenshots).
      surf-cli genera arte con IA. No usamos eso.
      En su lugar, agent-browser captura screenshots de páginas web reales, UIs
      y aplicaciones en ejecución via `agent-browser open <url>` y
      `agent-browser screenshot <path>`.
      Actualizar la línea de compatibilidad, references/extras.md (sección Images)
      y cualquier otro lugar donde se mencione surf-cli o `surf`. Mantener el flujo de embeber en base64 pero adaptado a
      los comandos de agent-browser.

  - name: r2-upload
    intent: >
      Reemplazar cualquier mecanismo de sharing de upstream (Vercel, share.sh,
      S3, GCS) por upload a Cloudflare R2 en la cuenta Arpagon@gmail.com,
      bucket visual-explainer, servido públicamente en https://ve.arpagon.co.
      El script está en scripts/upload.py (copiado desde files/).
      Uso: `uv run {{skill_dir}}/scripts/upload.py [--keep] <html> [assets...]`.
      Todos los archivos de una llamada comparten una carpeta UUIDv7.
      Ruta: <tmp|keep>/<user>/<host>/<harness>/<uuid>/<archivo>, para saber quién,
      desde qué máquina y con qué agente (VE_HARNESS, default pi) se publicó.
      Por defecto van a tmp/ y una lifecycle rule de R2 los borra a los
      30 días; con --keep van a keep/ y persisten.
      Configuración via variables de entorno: VE_R2_ACCOUNT_ID, VE_R2_BUCKET,
      VE_R2_PUBLIC_URL, VE_HARNESS, y CLOUDFLARE_API_TOKEN (las credenciales S3 se derivan
      del token) u opcionalmente VE_R2_ACCESS_KEY_ID + VE_R2_SECRET_ACCESS_KEY.
      Asegurar que SKILL.md tenga una sección corta "Share" (solo cuando el usuario
      pida compartir) que apunte a upload.py y a commands/share.md (desde files/).
      Quitar todas las referencias a Vercel, vercel-deploy, share.sh, S3 y GCS.
